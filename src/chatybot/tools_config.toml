[config]
tool_timeout = 60
rate_limit_delay = 2.0
max_turns = 25
strip_thinking_from_filebanks = true
shell = true
default_profile = ""
profile_dir = "~/.config/chatybot/profiles"
enable_profile_edit = true
session_mode = "auto"
session_dir = "~/.local/share/chatybot/sessions"
session_strip_thinking = "separate"
tool_scratch = false
backup_file_on_write = true
# editor = "nano"
agentic_instructions = """
IMPORTANT: You are executing in an autonomous, multi-turn tool-calling loop.
Use tools ONLY when necessary to perform actions on the system or fetch external information. If the request can be answered directly using your general knowledge without tools, do not call any tools and answer directly in natural language.
1. You can output one or more tool calls in a single turn if they can be executed in parallel or sequence. Use the JSON format enclosed in ```json ... ```.
2. Do NOT output any conversational text, descriptions, planning thoughts, or explanations before or after the tool calls. Your entire response must be ONLY the JSON tool call block(s).
3. Only output natural language/conversation when you have finished all tool executions and are ready to present the final result to the user.
"""

[tools.list_directory]
enabled = true
description = "List contents of a directory"
module = "chatybot.tools.file_utils"
function = "list_directory"

[tools.list_directory.parameters.path]
type = "string"
description = "Directory path to list"
optional = true

[tools.list_directory.parameters.details]
type = "boolean"
description = "If true, returns detailed file metadata (size, type, modification date)"
optional = true

[tools.read_file]
enabled = true
description = "Read the contents of a file with optional line range filtering"
module = "chatybot.tools.file_utils"
function = "read_file"

[tools.read_file.parameters.path]
type = "string"
description = "File path to read"
optional = false

[tools.read_file.parameters.start_line]
type = "integer"
description = "Starting line number (1-indexed)"
optional = true

[tools.read_file.parameters.end_line]
type = "integer"
description = "Ending line number (inclusive)"
optional = true

[tools.find_files]
enabled = true
description = "Find files matching a pattern, optionally containing a literal search term"
module = "chatybot.tools.file_utils"
function = "find_files"

[tools.find_files.parameters.path]
type = "string"
description = "Starting directory path"
optional = true

[tools.find_files.parameters.pattern]
type = "string"
description = "Filename glob pattern (e.g. *.txt)"
optional = true

[tools.find_files.parameters.search_term]
type = "string"
description = "Literal text substring to search for inside files (does NOT support regex or logical operators like '|')"
optional = true

[tools.find_files.parameters.details]
type = "boolean"
description = "If true, returns detailed file metadata (size, path, type, modification date)"
optional = true

[tools.run_command]
enabled = true
description = """Execute a shell command safely. Use shell=False, command will be split into tokens. Example: 'find . -name *.chatdsl -exec ls -l {} +'
cd does not persist between calls. Use absolute paths in every command; don't issue cd as a setup command, it has no effect on what follows"""
module = "chatybot.tools.file_utils"
function = "run_command"

[tools.run_command.parameters.command]
type = "string"
description = "The shell command to execute"
optional = false

[tools.write_file]
enabled = true
description = "Write or append content to a file"
module = "chatybot.tools.file_utils"
function = "write_file"

[tools.write_file.parameters.path]
type = "string"
description = "The path of the file to write to"
optional = false

[tools.write_file.parameters.content]
type = "string"
description = "The content to write to the file"
optional = false

[tools.write_file.parameters.append]
type = "boolean"
description = "If true, appends content instead of overwriting"
optional = true

[tools.change_dir]
enabled = true
description = "Change the current working directory"
module = "chatybot.tools.file_utils"
function = "change_dir"

[tools.change_dir.parameters.path]
type = "string"
description = "The path to the new working directory"
optional = false

[tools.grep_search]
enabled = true
description = "Search for exact patterns or regex matches across files, returning line numbers and content snippets"
module = "chatybot.tools.file_utils"
function = "grep_search"

[tools.grep_search.parameters.query]
type = "string"
description = "The text pattern or regular expression to search for"
optional = false

[tools.grep_search.parameters.path]
type = "string"
description = "Starting directory or file path"
optional = true

[tools.grep_search.parameters.pattern]
type = "string"
description = "Filename glob pattern (e.g. *.py)"
optional = true

[tools.grep_search.parameters.case_insensitive]
type = "boolean"
description = "If true, ignores case during match"
optional = true

[tools.grep_search.parameters.is_regex]
type = "boolean"
description = "If true, treats query as a regular expression pattern"
optional = true

[tools.grep_search.parameters.max_matches]
type = "integer"
description = "Maximum number of matches to return (default 100)"
optional = true

[tools.replace_file_content]
enabled = true
description = "Replace a specific block of text in a file with new content"
module = "chatybot.tools.file_utils"
function = "replace_file_content"

[tools.replace_file_content.parameters.path]
type = "string"
description = "The path of the file to modify"
optional = false

[tools.replace_file_content.parameters.target]
type = "string"
description = "The exact block of text to be replaced"
optional = false

[tools.replace_file_content.parameters.replacement]
type = "string"
description = "The new text to replace the target block with"
optional = false

[tools.replace_file_content.parameters.start_line]
type = "integer"
description = "Optional starting line number (1-indexed) to restrict replacement search"
optional = true

[tools.replace_file_content.parameters.end_line]
type = "integer"
description = "Optional ending line number (inclusive) to restrict replacement search"
optional = true

[tools.calculate]
enabled = true
description = "Safely evaluate a mathematical or natural language math expression using mathparse. Optionally save the calculated result into a script variable."
module = "chatybot.tools.math_utils"
function = "calculate"

[tools.calculate.parameters.expression]
type = "string"
description = "The mathematical or natural language expression to evaluate (e.g. '100 * 4', 'fifty times two', '2 + ${val}')"
optional = false

[tools.calculate.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the evaluation result into"
optional = true

[tools.str_search]
enabled = true
description = "Search for a substring pattern in text with optional case-insensitive matching. Returns match count or positions, and optionally stores the result in a script variable."
module = "chatybot.tools.str_utils"
function = "str_search"

[tools.str_search.parameters.pattern]
type = "string"
description = "The substring pattern to search for"
optional = false

[tools.str_search.parameters.text]
type = "string"
description = "The text to search within"
optional = false

[tools.str_search.parameters.mode]
type = "string"
description = "Search mode: 'c' for count (default), 'm' for match positions list"
optional = true

[tools.str_search.parameters.case_sensitive]
type = "boolean"
description = "Whether the search is case-sensitive (default: true). Set false for case-insensitive."
optional = true

[tools.str_search.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the search result into"
optional = true

[tools.get_context_metrics]
enabled = true
description = "Get the current size of the context in characters, KB, estimated average tokens, and turn counts for session history, agentic tool loop, and total prompt context."
module = "chatybot.tools.context_utils"
function = "get_context_metrics"

[tools.get_context_metrics.parameters.scope]
type = "string"
description = "Scope to inspect: 'all' (default), 'session' (session history only), or 'agentic_loop' (agentic tool loop history only)"
optional = true

[tools.get_context_metrics.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the metrics dictionary into"
optional = true

[tools.session_search]
enabled = true
description = "Search across past session turns, conversation history, notes, and scratchpad areas with boolean AND/OR logic and date filtering. Returns match items and matching sessions with entire session storage sizes (in bytes)."
module = "chatybot.tools.context_query"
function = "session_search"

[tools.session_search.parameters.query]
type = "string"
description = "Keywords or search phrase (e.g. 'database migration error'). Pass '*' or empty string to match all sessions under date/time filters."
optional = true

[tools.session_search.parameters.operator]
type = "string"
description = "Match logic: 'AND' (all terms must match) or 'OR' (any term matches). Default is 'AND'."
optional = true

[tools.session_search.parameters.since]
type = "string"
description = "Filter items after this timestamp or relative expression (e.g. 'yesterday', '7d', 'lastmonth', '2026-03-01')"
optional = true

[tools.session_search.parameters.until]
type = "string"
description = "Filter items before this timestamp (e.g. '2026-05-01')"
optional = true

[tools.session_search.parameters.range]
type = "string"
description = "Date range expression (e.g. '03/01/2026 to 05/01/2026' or '2026-03-01..2026-05-01')"
optional = true

[tools.session_search.parameters.include_scratch]
type = "boolean"
description = "Whether to include the user scratchpad directory in the search (default: true)"
optional = true

[tools.session_search.parameters.limit]
type = "integer"
description = "Maximum number of match items to return (default: 15)"
optional = true

[tools.session_search.parameters.ids_only]
type = "boolean"
description = "If true, only returns matching session IDs without turn details (fast discovery, saves context)"
optional = true

[tools.session_search.parameters.full]
type = "boolean"
description = "If true, returns complete turn prompt and response without 80-character snippet truncation"
optional = true

[tools.session_search.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the search results into"
optional = true

[tools.session_get]
enabled = true
description = "Extract read-only prompt, response, thinking, or full exchange text from a past session or the active session without switching sessions."
module = "chatybot.tools.context_query"
function = "session_get"

[tools.session_get.parameters.session_id]
type = "string"
description = "The session ID or custom name to extract from (use 'active' for the current session)"
optional = false

[tools.session_get.parameters.turn_id]
type = "integer"
description = "Optional 1-based turn number to extract. If omitted, extracts all turns."
optional = true

[tools.session_get.parameters.part]
type = "string"
description = "Which part of the turn to extract: 'both' (default), 'prompt', 'response', or 'thinking'"
optional = true

[tools.session_get.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the extracted text into"
optional = true

[tools.ask_user]
enabled = true
description = "Prompt the user interactively for input (choice, yesno, or text)."
module = "chatybot.tools.interact_utils"
function = "ask_user"

[tools.ask_user.parameters.prompt]
type = "string"
description = "The question or message to display to the user"
optional = false

[tools.ask_user.parameters.choices]
type = "array"
description = "List of choices for multiple choice questions"
optional = true

[tools.ask_user.parameters.question_type]
type = "string"
description = "Question type: 'yesno', 'choice', or 'text' (default: 'text')"
optional = true

[tools.ask_user.parameters.target_variable]
type = "string"
description = "Optional script variable name to save the answer into (answer is also always saved to ASK_RESULT)"
optional = true

[tools.db_search]
enabled = false
description = "Search a TinyDB database for items matching a query string across name, content, and metadata fields. If query is omitted or '*', lists all items. Tip: pass full_content=true to retrieve complete untruncated content in a single step without needing db_get."
module = "chatybot.tools.db_tools"
function = "db_search"

[tools.db_search.parameters.query]
type = "string"
description = "Search term, or '*' / empty string to list all items (default '*')"
optional = true

[tools.db_search.parameters.db_name]
type = "string"
description = "Database name to search. If omitted, uses the currently active database."
optional = true

[tools.db_search.parameters.limit]
type = "number"
description = "Maximum number of results to return (default 20)"
optional = true

[tools.db_search.parameters.full_content]
type = "boolean"
description = "If true, return the full untruncated content instead of a 500-character preview (default false)"
optional = true

[tools.db_get]
enabled = false
description = "Retrieve a single complete item from a TinyDB database by its integer ID. If db_name is omitted, uses the active database from the session or previous db_search."
module = "chatybot.tools.db_tools"
function = "db_get"

[tools.db_get.parameters.item_id]
type = "number"
description = "The integer ID (doc_id) of the database item to retrieve"
optional = false

[tools.db_get.parameters.db_name]
type = "string"
description = "Database name to search. If omitted, uses the currently active database."
optional = true

[tools.db_list]
enabled = false
description = "List all available TinyDB databases with entry counts and file sizes."
module = "chatybot.tools.db_tools"
function = "db_list"
