# ==============================================================================
# ChatyBot Pluggable Security Policy Configuration Example
# File: src/chatybot/security/default_security.toml
# Copied/Created at: ~/.config/chatybot/security.toml
# Independent of tools_config.toml and ChatDSL scripts
# ==============================================================================

version = "1.0"

# Active policy evaluation engine:
# Options: "builtin" (in-process Python) | "binary" (external CLI/Rust) | "wasm" | "socket"
engine = "builtin"

# Fail-safe behavior if an external engine crashes or times out: "deny" | "ask"
fail_safe = "deny"

# Resolution for ASK verdicts when running non-interactively (scripts / headless) without -y:
# Options: "deny" (safe default, fail-fast) | "allow"
non_interactive_ask = "deny"


# ------------------------------------------------------------------------------
# Built-in Engine Configuration
# ------------------------------------------------------------------------------
[builtin]
# Fallback verdict for unrecognized tools not governed by rules: "ask" | "deny" | "allow"
default_verdict = "ask"

# ------------------------------------------------------------------------------
# Security DSL Rules (Evaluated deny-overrides by tier: deny > ask > allow > baseline. Within a tier, first match wins.)
# Syntax: <Action> <ToolTarget> <Condition> [because "<Reason>"]
# ------------------------------------------------------------------------------
dsl_rules = [
    # --- Sensitive File & Secret Guards ---
    "do not read file with api_key in it",
    "never read file with id_rsa in it",
    "never write file ending with .env",
    "block write file with token in it",
    
    # --- Safe File Allow-Lists ---
    "allow read file ending with .md because 'documentation files are always safe'",
    "allow read file ending with .txt",
    
    # --- Command Execution Safeguards ---
    "ask before run command with sudo",
    "deny run command with mkfs in it",
    "deny run command with 'rm -rf' in it",
    "deny run command with ':(){ :|:& };:' in it",
    "deny run command with chatybot in it because 'prevent recursive sub-agent execution and privilege escalation'",

    # --- Git Destructive Safeguards (Tier 1 DENY) ---
    "deny run command with 'git reset --hard' in it because 'destructive git reset can discard uncommitted changes'",
    "deny run command with 'git clean -f' in it because 'destructive git clean removes untracked files'",
    "deny run command with 'git push --force' in it because 'destructive force push can overwrite remote history'",

    # --- Shell Chaining & Compound Command Guards (Tier 2 ASK overrides Tier 3 ALLOW) ---
    "ask before run command with '&&' in it",
    "ask before run command with ';' in it",
    "ask before run command with '|' in it",
    "ask before run command with '$(' in it",
    "ask before run command with '`' in it",

    # --- Safe Read-Only Git Allow-List (Tier 3 ALLOW) ---
    "allow run command starting with 'git status'",
    "allow run command starting with 'git diff'",
    "allow run command starting with 'git log'",
    "allow run command starting with 'git show'",
    "allow run command starting with 'git branch'",
    "allow run command starting with 'git rev-parse'",
    "allow run command starting with 'git remote'",
    "allow run command starting with 'git ls-files'",
    
    # --- Directory Deletion & Modification ---
    "deny delete file in /var",
    "deny delete file in /etc",
    "ask before delete file",
    "ask before remove directory",
]


# ------------------------------------------------------------------------------
# Baseline File System Path Restrictions (Always Denied)
# ------------------------------------------------------------------------------
[builtin.path_restrictions]
denied_paths = [
    "/etc",
    "/var/root",
    "/boot",
    "/System",
    "~/.ssh",
    "~/.gnupg",
    "~/.aws",
]

# ------------------------------------------------------------------------------
# Catastrophic Shell Patterns (Always Denied for run_command)
# ------------------------------------------------------------------------------
[builtin.command_rules]
denied_patterns = [
    "rm -rf /",
    "rm -rf /*",
    ":(){ :|:& };:",
    "mkfs",
    "dd if=/dev/zero",
    "> /dev/sda",
    "> /dev/disk",
    "chatybot",
]



# ==============================================================================
# External Engine Configurations (Used when engine != "builtin")
# ==============================================================================

# Option 1: External Binary / CLI Adapter (stdin/stdout JSON)
[binary]
path = "~/.config/chatybot/security/policy_guard"
timeout_seconds = 2.0
args = ["--strict"]

# Option 2: In-Process WebAssembly Sandbox (WASI)
[wasm]
path = "~/.config/chatybot/security/policy.wasm"
entrypoint = "evaluate_policy"
timeout_ms = 500

# Option 3: Local Daemon (Unix Domain Socket / gRPC)
[socket]
socket_path = "/tmp/chatybot_security.sock"
timeout_seconds = 1.5
