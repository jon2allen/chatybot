# ============================================================================
# IMAGE GENERATION SETTINGS
# ============================================================================

[image_generation]
# Default directory for saving generated images
default_dir = "~/chatybot_images"

# Default image size - 1024x1024 is supported by ALL major image models
default_size = "1024x1024"

# Default quality
default_quality = "standard"

# ============================================================================
# CHAT MODELS
# ============================================================================

[models.mistral_1]
name = "mistral-large-2512"
temperature = 0.7
top_k = 1
base_url = "https://api.mistral.ai/v1"
api_key = "MISTRAL_API_KEY"
image_generation = true
image_endpoint = "/images/generations"
vendor = "mistral"

[models.devstral_1]
name = "devstral-2512"
temperature = 0.7
top_k = 1
base_url = "https://api.mistral.ai/v1"
api_key = "MISTRAL_API_KEY"

[models.gemini_flash]
# Gemini Model running on Google's OpenAI-compatible endpoint
name = "gemini-2.5-flash"
temperature = 0.0
top_k = 1
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key = "GEMINI_API_KEY"
image_generation = true
image_endpoint = "/images/generations"
vendor = "google"

[models.gemini_pro]
# Another Gemini model
name = "gemini-2.5-pro"
temperature = 0.0
top_k = 1
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key = "GEMINI_API_KEY"
image_generation = true
image_endpoint = "/images/generations"
vendor = "google"

[models.gemma_3]
# Another model, same endpoint
name = "gemma-3-27b-it"
temperature = 0.2
top_k = 1
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key = "GEMINI_API_KEY"

[models.openai_gpt4]
# Example of a different vendor (OpenAI)
name = "gpt-4o"
temperature = 0.1
top_k = 1
base_url = "https://api.openai.com/v1"
api_key = "OPENAI_API_KEY"
image_generation = true
image_endpoint = "/images/generations"
vendor = "openai"

# ============================================================================
# OPENROUTER MODELS
# ============================================================================

# OpenRouter image generation model - uses chat/completions with modalities
[models.openrouter_image]
name = "google/gemini-2.5-flash-image"
temperature = 0.0
top_k = 1
base_url = "https://openrouter.ai/api/v1"
api_key = "OPENROUTER_API_KEY"
image_generation = true
image_endpoint = "/chat/completions"
vendor = "openrouter"

# Flux.2 image generation model via OpenRouter
