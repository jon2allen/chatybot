# ============================================================================
# AUDIO SETTINGS
# ============================================================================

[audio]
# Default audio directory
default_dir = "~/chatybot_audio"

# Default audio format for generation
default_format = "mp3"

# Default STT model (must match a model alias below)
default_stt_model = "voxtral-mini-3b"

# Default TTS model
default_tts_model = "voxtral-tts"

# ============================================================================
# AUDIO MODELS - STT (Speech-to-Text)
