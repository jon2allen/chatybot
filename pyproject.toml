[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatybot"
version = "0.8.7"
description = "A CLI-based AI chat assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jon Allen" }]
dependencies = [
    "openai>=1.61.0",
    "tinydb",
    "pygments",
    "parsley",
    "aiohttp",
    "EasyRerank>=0.2.2",
    "pyio-intercept>=0.1.0",
    "psutil",
    "mcp<2.0.0",
    "mathparse>=0.2.8",
    "pyreadline3; sys_platform == 'win32'",
    "windows-curses; sys_platform == 'win32'"
]

[project.optional-dependencies]
apple_fm = ["apple-fm-sdk"]

[project.urls]
"Homepage" = "https://github.com/jon2allen/chatybot"
"Documentation" = "https://github.com/jon2allen/chatybot/tree/master/doc"
"Cookbook" = "https://github.com/jon2allen/chatybot/blob/master/doc/chatdsl_cookbook.md"
"Repository" = "https://github.com/jon2allen/chatybot"
"Bug Tracker" = "https://github.com/jon2allen/chatybot/issues"

[project.scripts]
chatybot = "chatybot.main:run"
chatdsl_parse = "chatybot.chatdsl_parse:main"
chatybot-config = "chatybot.config_tui:main"
chatybot-migrate-sessions = "chatybot.migrate_sessions:main"
chatybot-setup-keys = "chatybot.setup_keys:main"

[tool.setuptools.package-data]
chatybot = [
    "*.toml",
    "*.chatdsl",
    "profiles/*.chatdsl",
    "translations.json",
    "doc/*",
    "doc/**/*",
]

[tool.ruff.lint]
# Datetime rules intentionally ignored:
# All timestamps in chatybot are local-time, single-machine, single-user.
# Naive datetimes are intentional for display strings, filenames, and session metadata.
# Async blocking rules intentionally ignored:
# chatybot runs a single-coroutine event loop with no concurrent tasks
# (no asyncio.create_task, gather, or TaskGroup anywhere in the codebase).
# Blocking open() and subprocess.run() calls inside async functions are
# harmless because nothing else is running on the event loop simultaneously.
# Re-enable these rules if subagents or concurrent task execution is added.
# Context manager rule intentionally ignored:
# SIM115 flags open() calls not wrapped in a with statement, but several
# file handles (log file, debug fd, temp file for editor) are intentionally
# kept open for the session lifetime. Converting to with would require
# restructuring or ExitStack for no functional benefit.
ignore = [
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "ASYNC230",
    "ASYNC221",
    "SIM115",
]
