[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatybot"
version = "0.8.0"
description = "A CLI-based AI chat assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jon Allen" }]
dependencies = [
    "openai>=1.61.0",
    "tinydb",
    "pygments",
    "parsley",
    "aiohttp",
    "EasyRerank>=0.2.2",
    "pyio-intercept>=0.1.0",
    "psutil",
    "mcp<2.0.0",
    "mathparse>=0.2.8",
    "pyreadline3; sys_platform == 'win32'",
    "windows-curses; sys_platform == 'win32'"
]

[project.urls]
"Homepage" = "https://github.com/jon2allen/chatybot"
"Documentation" = "https://github.com/jon2allen/chatybot/tree/main/doc"
"Cookbook" = "https://github.com/jon2allen/chatybot/blob/main/doc/chatdsl_cookbook.md"
"Repository" = "https://github.com/jon2allen/chatybot"
"Bug Tracker" = "https://github.com/jon2allen/chatybot/issues"

[project.scripts]
chatybot = "chatybot.main:run"
chatdsl_parse = "chatybot.chatdsl_parse:main"
chatybot-config = "chatybot.config_tui:main"
chatybot-migrate-sessions = "chatybot.migrate_sessions:main"

[tool.setuptools.package-data]
chatybot = ["*.toml", "*.chatdsl", "profiles/*.chatdsl", "translations.json"]
