[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatybot"
version = "0.5.3"
description = "A CLI-based AI chat assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jon Allen" }]
dependencies = [
    "openai>=1.61.0",
    "tinydb",
    "pygments",
    "parsley",
    "aiohttp",
    "EasyRerank>=0.2.2"
]

[project.scripts]
chatybot = "chatybot.main:run"
chatdsl_parse = "chatybot.chatdsl_parse:main"
chatybot-config = "chatybot.config_tui:main"

[tool.setuptools.package-data]
chatybot = ["*.toml", "*.chatdsl"]
