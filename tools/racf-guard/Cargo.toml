[package]
name = "racf-guard"
version = "0.1.0"
edition = "2021"
description = "Reference RACF (Resource Access Control Facility) security guard for Chatybot"
authors = ["Jon Allen"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob-match = "0.2"
clap = { version = "4.5", features = ["derive"] }
